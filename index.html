<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollow Knight Save Editor</title>
<style>
:root{color-scheme:dark;--bg:#0f0f0f;--panel:#161616;--line:#292929;--line2:#373737;--tx:#dcdcdc;--mut:#8d8d8d;--dim:#626262;--hi:#ededed;--acc:#d2d2d2;--acc2:#e6e6e6;--good:#7fc79b;--bad:#c48484}
*{box-sizing:border-box;margin:0}
html{background:#0b0b0b;min-height:100%}
body{background:radial-gradient(1200px 700px at 70% -10%,#282828 0,#101010 60%,#0b0b0b 100%) no-repeat #0b0b0b;min-height:100vh;color:var(--tx);font:14px/1.4 Inter,system-ui,Segoe UI,sans-serif;overflow-x:hidden}
.serif{font-family:Georgia,"DejaVu Serif",serif}
button{font:inherit;color:inherit;cursor:pointer}
.top{height:68px;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:#0f0f0f}
.logo{font-family:Georgia,serif;font-size:19px;letter-spacing:.12em;white-space:nowrap;color:var(--hi)}
.logo small{display:block;font:10px Inter,sans-serif;letter-spacing:.3em;color:#7c7c7c;margin-top:2px}
.file{margin-left:18px;padding:7px 14px;border:1px solid var(--line2);border-radius:20px;background:#171717;color:#afafaf;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.file b{color:var(--hi);font-weight:500}
.sp{flex:1}
.btn{padding:9px 15px;border-radius:8px;border:1px solid var(--line2);background:#1a1a1a;color:#cdcdcd;font-size:13px;white-space:nowrap}
.btn:hover{border-color:#5b5b5b;background:#202020}
.btn.p{background:#e3e3e3;color:#111111;border-color:#e3e3e3;font-weight:600}
.btn.p:hover{background:#fff}
.btn[disabled]{opacity:.35;pointer-events:none}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr) 300px;min-height:calc(100vh - 68px)}
.nav{border-right:1px solid var(--line);padding:20px 12px}
.nav button{display:flex;width:100%;align-items:center;gap:11px;padding:9px 11px;border-radius:8px;color:#959595;margin-bottom:3px;background:none;border:0;text-align:left}
.nav button:hover{background:#181818}
.nav button.a{background:#1e1e1e;color:var(--hi);box-shadow:inset 2px 0 0 var(--acc)}
.nav h6{font-size:10px;letter-spacing:.25em;color:var(--dim);margin:18px 12px 8px;font-weight:500}
.nav .img{width:24px!important;height:24px!important;border-radius:6px}
.nav .img svg{width:13px;height:13px}
.content{padding:24px 28px 60px;min-width:0}
h2{font:400 19px Georgia,serif;letter-spacing:.08em;margin-bottom:14px;color:var(--hi)}
.img{position:relative;border-radius:12px;background:linear-gradient(135deg,#242424,#161616);border:1px dashed #454545;display:flex;align-items:center;justify-content:center;color:#636363;flex:none;overflow:hidden}
.img.ok{border-style:solid;border-color:#373737;background:#141414}
.img img{position:absolute;inset:6%;width:88%;height:88%;object-fit:contain}
.card{background:#161616cc;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.row{display:grid;gap:16px;margin-bottom:22px}
.r3{grid-template-columns:1.35fr 1fr 1fr}.r2{grid-template-columns:1fr 1.6fr}
.lab{font-size:10.5px;letter-spacing:.22em;color:#7c7c7c;margin-bottom:10px;text-transform:uppercase}
.masks{display:flex;gap:7px;flex-wrap:wrap}
.mask{width:38px;height:38px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;border:1px solid var(--line2);background:radial-gradient(circle at 35% 30%,#f5f5f5,#bababa);cursor:pointer;transition:.15s}
.mask.off{opacity:.2;filter:grayscale(1)}
.mask:hover{transform:translateY(-2px)}
.val{font:26px Georgia,serif;color:#f4f4f4}
.val small{font:12px Inter;color:#7c7c7c}
.step{display:flex;align-items:center;gap:8px;margin-top:12px}
.step button{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--line2);border-radius:7px;color:#afafaf;background:#1a1a1a;font-size:12px}
.step button:hover{border-color:#5b5b5b;color:#fff}
.step em{font-style:normal;margin-left:auto;font-size:11.5px;color:var(--acc)}
input[type=number],input[type=text]{background:#0f0f0f;border:1px solid var(--line2);color:var(--hi);border-radius:8px;padding:6px 10px;font:inherit;min-width:0}
input:focus,textarea:focus{outline:1px solid var(--acc)}
.geo{font:26px Georgia,serif;width:160px}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;padding:7px 0;border-radius:8px;border:1px solid #313131;color:#8d8d8d;font-size:12px;background:none}
.seg button.s{background:#e3e3e3;color:#111111;border-color:#e3e3e3;font-weight:600}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.head h2{margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:5px 12px;border-radius:16px;border:1px solid #313131;color:#8d8d8d;font-size:12px;background:none}
.chips button.s{background:#232323;color:#dfdfdf;border-color:#4d4d4d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:14px}
.charm{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:.15s}
.charm:hover{border-color:#4e4e4e}
.charm .cn{font-size:11.5px;text-align:center;color:#d8d8d8;min-height:28px;line-height:14px;display:flex;align-items:center}
.charm.locked{opacity:.45}.charm.locked .img{filter:grayscale(1)}
.charm.eq{border-color:var(--acc);box-shadow:0 0 0 1px #a8a8a844,0 0 22px #a8a8a822}
.nt{display:flex;gap:4px}.nt i{width:9px;height:9px;border-radius:50%;border:1px solid #505050;display:block}.nt i.on{background:var(--acc2);border-color:var(--acc2)}
.badge{position:absolute;top:-8px;right:8px;background:var(--acc);color:#101010;font-size:8.5px;letter-spacing:.14em;font-weight:700;padding:2px 7px;border-radius:9px}
.eqbtn{font-size:10.5px;padding:3px 10px;border-radius:10px;border:1px solid var(--line2);background:none;color:var(--mut)}
.eqbtn:hover{border-color:var(--acc);color:var(--hi)}
.notch{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12.5px}
.tiles{display:flex;gap:14px;flex-wrap:wrap}
.tile{text-align:center;cursor:pointer;width:84px}
.tile .nm{font-size:10.5px;margin-top:6px;color:#959595;line-height:13px}
.tile.off{opacity:.35}.tile.off .img{filter:grayscale(1)}
.tile.on .img{border-color:var(--acc)}
.big{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.num{display:grid;grid-template-columns:48px minmax(0,1fr);grid-template-rows:auto auto;gap:6px 12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.num .img{grid-row:1/3;width:48px!important;height:48px!important}
.num .nl{font-size:12.5px;color:#c4c4c4;line-height:1.25;min-width:0}
.num .nl small{display:block;color:var(--dim);font-size:10.5px}
.num .ctl{display:flex;gap:6px;align-items:stretch}
.num .ctl input{flex:1;min-width:0;width:100%;text-align:center;height:34px}
.num .ctl .sb{width:34px;flex:none;height:34px;padding:0;border:1px solid var(--line2);border-radius:8px;background:#222;color:#ccc;font-size:15px;line-height:1}
.num .ctl .sb:hover{border-color:#666;color:#fff}
.num.chk{grid-template-rows:auto;grid-template-columns:48px minmax(0,1fr) auto;cursor:pointer}
.num.chk .img{grid-row:auto}
.num.chk.off .img{filter:grayscale(1);opacity:.45}
.num.chk:hover{border-color:#555}
.jrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 130px 70px;gap:10px;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-size:12.5px}
.jn{display:flex;align-items:center;gap:12px;min-width:0}.jn>span{min-width:0}
.img.ico{border-style:solid;border-color:#3a3a3a}
.jrow,.vrow{content-visibility:auto;contain-intrinsic-size:auto 56px}
.num{content-visibility:auto;contain-intrinsic-size:auto 88px}
.more{margin:16px auto;display:block}
.file small{color:var(--mut)}
select{background:#0a0a0a;border:1px solid var(--line2);color:var(--hi);border-radius:8px;padding:8px 10px;font:inherit;max-width:130px}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.area{background:#0f0f0fcc;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.area h3{font:400 13px Georgia,serif;letter-spacing:.12em;color:var(--hi);text-transform:uppercase}
.area .num.chk.sel{border-color:var(--acc);box-shadow:0 0 0 1px #d2d2d233}
details.lockd{margin-top:22px;color:var(--mut);font-size:12.5px}
details.lockd summary{cursor:pointer;margin-bottom:10px}
details.lockd ul{columns:3 240px;list-style:none;padding:0;line-height:1.9}
details.lockd b{color:#bdbdbd;font-weight:500}

.pin{position:absolute;width:24px;height:24px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #7a1f1f;background:#c42b2b;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.pin img{width:100%;height:100%;object-fit:contain;image-rendering:auto}
.pin.ok{background:#0008;border-color:#fff5}
.pin.free{filter:grayscale(.85) brightness(.8)}
.pin:hover{transform:translate(-50%,-50%) scale(1.35);z-index:3}
.pin.sel{outline:2px solid #fff;outline-offset:2px;z-index:2}
.pin.on{box-shadow:0 0 0 3px #e6e6e6,0 0 14px 4px #ffffff88;z-index:4}
.bpanel{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:14px}
.jrow.h{background:none;border:0;color:var(--dim);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase}
.jrow input[type=number]{width:100%;height:30px;text-align:center}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=checkbox]{accent-color:#c8c8c8;width:18px;height:18px;cursor:pointer}
.mk{cursor:pointer;transition:.15s}.mk.off{opacity:.25;filter:grayscale(1)}.mk:hover{transform:translateY(-2px)}
.side{border-left:1px solid var(--line);padding:22px 18px;background:#0e0e0e}
.diff{margin-bottom:9px;padding:10px 12px;border-radius:10px;background:#181818;border:1px solid var(--line)}
.diff b{font-weight:500;color:#dfdfdf;font-size:13px}
.diff div{font-size:11.5px;color:var(--mut);margin-top:3px;word-break:break-all}
.diff s{color:#a06a6a}.diff u{text-decoration:none;color:var(--good)}
.raw{margin-top:8px;background:#0a0a0a;border:1px solid #232323;border-radius:10px;padding:12px;font:10.5px/1.7 Consolas,"DejaVu Sans Mono",monospace;color:#828282;word-break:break-all;max-height:220px;overflow:auto}
.hint{margin-top:16px;color:#7c7c7c;font-size:11.5px;line-height:1.6}
.drop{margin:8vh auto 0;max-width:620px;text-align:center;border:2px dashed #3f3f3f;border-radius:20px;padding:56px 30px;background:#141414aa}
.drop h1{font:400 26px Georgia,serif;letter-spacing:.1em;color:var(--hi);margin-bottom:10px}
.drop p{color:var(--mut);margin-bottom:18px;line-height:1.6}
.drop .opt{margin-top:18px;font-size:12.5px;color:#959595}
.cover{position:fixed;inset:0;background:#0f0f0fdd;border:3px dashed var(--acc);z-index:50;display:flex;align-items:center;justify-content:center;font:22px Georgia,serif;letter-spacing:.1em;pointer-events:none}
.rawbox{position:fixed;left:0;right:0;bottom:0;height:55vh;background:#0b0b0b;border-top:1px solid var(--line2);z-index:20;display:flex;flex-direction:column;padding:12px 18px;gap:10px}
.rawbox textarea{flex:1;background:#080808;color:#afafaf;border:1px solid var(--line);border-radius:8px;padding:12px;font:12px/1.5 Consolas,"DejaVu Sans Mono",monospace;resize:none}
.rawbox .bar{display:flex;gap:10px;align-items:center}
.vlist{display:flex;flex-direction:column;gap:6px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px;align-items:center;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.vrow span{font:12px Consolas,monospace;color:#afafaf;word-break:break-all}
.vrow input[type=text],.vrow input[type=number]{width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#232323;border:1px solid #4d4d4d;color:#dfdfdf;padding:10px 18px;border-radius:10px;z-index:60;font-size:13px}
@media(max-width:1100px){.layout{grid-template-columns:70px minmax(0,1fr)}.side{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.nav button span,.nav h6{display:none}.r3,.r2{grid-template-columns:1fr}}
@media(max-width:640px){.top{flex-wrap:wrap;height:auto;padding:10px 14px}.file{display:none}.content{padding:18px 14px}.vrow{grid-template-columns:1fr}}
</style>

function label(k){let m;if(BN[k])return BN[k]+' defeated';if(m=/^gotCharm_(\d+)$/.exec(k))return 'Charm owned: '+(CH[+m[1]]?CH[+m[1]][0]:m[1]);if(m=/^equippedCharm_(\d+)$/.exec(k))return 'Charm equipped: '+(CH[+m[1]]?CH[+m[1]][0]:m[1]);
 const f=NUMS.concat(BOOLS).find(x=>x[0]===k);const a=ABIL.find(x=>x[0]===k);return f?f[1]:a?a[1]:k}
const DC={v:-1,s:null,d:[]};
function diffs(){if(!S.cur)return[];if(DC.v===S.v&&DC.s===S.cur)return DC.d;
 const o=S.orig.playerData,c=pd(),out=[];const keys=new Set([...Object.keys(o),...Object.keys(c)]);
 keys.forEach(k=>{const x=o[k],y=c[k];if(x===y)return;const a=JSON.stringify(x),b=JSON.stringify(y);if(a!==b)out.push([k,a===undefined?'—':a,b===undefined?'(removed)':b])});
 if(S.sceneDirty&&JSON.stringify(S.orig.sceneData)!==JSON.stringify(S.cur.sceneData))out.push(['sceneData','original','edited (raw)']);
 DC.v=S.v;DC.s=S.cur;DC.d=out;return out}

/* actions */
function equippedSum(){let s=0;for(let i=1;i<=40;i++)if(g('equippedCharm_'+i,false))s+=g('charmCost_'+i,CH[i][2]);return s}
function special(k){if(k==='nailSmithUpgrades')setNail(g(k));if(k==='maxHealthBase')setMasks(g(k));if(k==='charmSlots')syncCharms()}
function syncCharms(){const eq=[];let own=0;for(let i=1;i<=40;i++){if(g('equippedCharm_'+i,false))eq.push(i);if(g('gotCharm_'+i,false))own++}
 if(has('equippedCharms'))set('equippedCharms',eq);if(has('charmsOwned'))set('charmsOwned',own);if(has('charmSlotsFilled'))set('charmSlotsFilled',equippedSum());if(has('overcharmed'))set('overcharmed',equippedSum()>g('charmSlots',0))}
function setMasks(n){n=Math.max(1,Math.min(9,n));['maxHealth','maxHealthBase','health'].forEach(k=>{if(has(k))set(k,n)});if(has('prevHealth'))set('prevHealth',n);if(has('maxHealthCap'))set('maxHealthCap',Math.max(g('maxHealthCap'),n))}
function setVessels(n){n=Math.max(0,Math.min(3,n));if(has('MPReserveMax'))set('MPReserveMax',n*33);if(has('MPReserve'))set('MPReserve',Math.min(g('MPReserve'),n*33))}
function setNail(n){set('nailSmithUpgrades',n);if(has('nailDamage'))set('nailDamage',5+4*n)}
function toggleCharm(i){const k='gotCharm_'+i,on=!g(k,false);set(k,on);if(!on&&has('equippedCharm_'+i))set('equippedCharm_'+i,false);
 if(i===36&&has('royalCharmState'))set('royalCharmState',on?Math.max(3,g('royalCharmState')):0);if(has('newCharm_'+i)&&on)set('newCharm_'+i,false);syncCharms()}
function toggleEquip(i){if(!g('gotCharm_'+i,false))return;set('equippedCharm_'+i,!g('equippedCharm_'+i,false));syncCharms()}

 if(a==='pick'){$('#fi').click();return}

 if(a==='tab'){S.tab=d.v;S.lim=40;S.q='';render();return}
 if(a==='rawtoggle'){S.raw=!S.raw;if(S.raw)S.rawText=pretty(S.cur);render();return}
 if(a==='rawapply'){try{const o=parseSave($('#rawta').value);if(!o||!o.playerData)throw 0;S.cur=o;S.sceneDirty=true;S.v++;S.raw=false;render();toast('Raw JSON applied')}catch(x){alert('Invalid JSON (needs a playerData section).')}return}
 if(a==='reset'){S.cur=cloneSave(S.orig);S.sceneDirty=false;S.v++;render();return}

 if(a==='mask')setMasks(+d.n===g('maxHealth')?+d.n-1:+d.n);
 else if(a==='masks')setMasks(g('maxHealth',5)+(+d.d));
 else if(a==='vessel')setVessels(+d.n===Math.round(g('MPReserveMax')/33)?+d.n-1:+d.n);

 else if(a==='nail')setNail(+d.n);
 else if(a==='step'){const k=d.k;set(k,Math.max(+(d.min||0),Math.min(+(d.max||999999999),g(k)+ +d.d)));special(k)}

 else if(a==='tramall'){TRAMS.forEach(x=>{if(has(x[0]))set(x[0],true)})}
 else if(a==='variant'){set(d.k,d.on==='1')}
 else if(a==='mapall'){Object.keys(pd()).forEach(k=>{if(typeof pd()[k]==='boolean'&&/^map[A-Z]/.test(k))set(k,true)})}
 else if(a==='jall'){enemies().forEach(([n,v])=>{if(v.killed)set(v.killed,true);if(v.kills)set(v.kills,0)})}
 else if(a==='toggle'){set(d.k,!g(d.k,false))}

 else if(a==='unlink'){saveLink(S.bsel,-1)}
 else if(a==='filter'){S.filter=d.v}
 else if(a==='slots'){set('charmSlots',Math.max(0,Math.min(11,g('charmSlots')+ +d.d)));syncCharms()}
 else if(a==='maxcharms'){for(let i=1;i<=40;i++)if(has('gotCharm_'+i))set('gotCharm_'+i,true);syncCharms()}
 else if(a==='unequipall'){for(let i=1;i<=40;i++)if(has('equippedCharm_'+i))set('equippedCharm_'+i,false);syncCharms()}
 else if(a==='allabil'){ABIL.forEach(x=>{if(has(x[0]))set(x[0],true)})}
 render()});

 <div class="row r2"><div class="card"><div class="lab">Nail upgrade</div><div style="display:flex;gap:12px;align-items:center">${img(NAILS[nail]||NAILS[0],52,'Nail')}<div style="color:#b5b5b5;font-size:12.5px">${NAILNAMES[nail]||'?'}<br>Damage ${5+4*nail}</div></div>
 <div class="seg">${['Old','Sharp','Chan.','Coil','Pure'].map((n,i)=>`<button class="${i===nail?'s':''}" data-a="nail" data-n="${i}">${n}</button>`).join('')}</div></div>

 for(let i=1;i<=40;i++){if(!has('gotCharm_'+i))continue;const own=g('gotCharm_'+i,false),eq=g('equippedCharm_'+i,false),c=g('charmCost_'+i,CH[i][2]);
